name: Build Debug APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unpack project zip
        run: |
         unzip -o MusicPlayer.zip
      - name: Unpack project zip
        run: |
          unzip -o MusicPlayer.zip
          python3 -c 'import glob; [open(p,"w").write(open(p).read().replace("Package ","package ")) for p in glob.glob("**/*.kt", recursive=True)]'
                    python3 -c 'import glob; kts="\n".join(open(p,errors="ignore").read() for p in glob.glob("**/*.kt",recursive=True)); src=glob.glob("**/com/example/musicplayer",recursive=True); open(src[0]+"/App.kt","w").write("package com.example.musicplayer\n\nimport android.app.Application\n\nclass App : Application()\n") if src and "class App" not in kts else None'
                    
  

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            PROJECT_DIR=$(find . -maxdepth 4 -name "settings.gradle*" -o -name "build.gradle*" | head -n 1 | xargs dirname)
            cd "${PROJECT_DIR:-.}"
            gradle wrapper --gradle-version 8.7
            chmod +x gradlew
            ./gradlew assembleDebug
          fi

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          
