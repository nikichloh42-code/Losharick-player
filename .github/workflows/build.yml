name: Build Debug APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unpack project zip
        run: |
          unzip -o MusicPlayer.zip
          python3 -c 'import glob; [open(p,"w").write(open(p).read().replace("Package ","package ")) for p in glob.glob("**/*.kt", recursive=True)]'
          python3 - << 'EOF'
          import glob
          for p in glob.glob("**/AndroidManifest.xml", recursive=True):
              txt = open(p, encoding="utf-8", errors="ignore").read()
              txt = txt.replace('android:name=".App"', 'android:name="android.app.Application"')
              txt = txt.replace("android:name='.App'", 'android:name="android.app.Application"')
              open(p, "w", encoding="utf-8").write(txt)
              for line in txt.splitlines():
                  if "android:name=" in line:
                      print("MANIFEST LINE:", p, line.strip())
          EOF
          echo "=== MAIN ACTIVITY ==="
          head -n 30 MusicPlayer/app/src/main/java/com/example/musicplayer/MainActivity.kt 2>/dev/null || true
          echo "=== PACKAGES ==="
          grep -rn -i "package " MusicPlayer/app/src/main/java/ 2>/dev/null || true
          echo "=== FULL MAIN ACTIVITY ==="
          cat MusicPlayer/app/src/main/java/com/example/musicplayer/MainActivity.kt 2>/dev/null || true
          echo "=== APP BUILD GRADLE ==="
          cat MusicPlayer/app/build.gradle.kts 2>/dev/null || true
          
          
                    
  

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            PROJECT_DIR=$(find . -maxdepth 4 -name "settings.gradle*" -o -name "build.gradle*" | head -n 1 | xargs dirname)
            cd "${PROJECT_DIR:-.}"
            gradle wrapper --gradle-version 8.7
            chmod +x gradlew
            ./gradlew assembleDebug
          fi

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          
